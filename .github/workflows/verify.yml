name: Verify portfolio
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static site
        run: npm run build
      - name: Check generated routes
        run: |
          test -f dist/index.html
          test -f dist/projects/index.html
          test -f dist/projects/code-atlas/index.html
          test -f dist/projects/showdar-router/index.html
          test -f dist/404.html
      - name: Verify featured card semantics
        run: node scripts/verify-featured-link.mjs
      - name: Verify terminal project demos
        run: node scripts/verify-terminal-demos.mjs
      - name: Verify portfolio UI enhancements
        run: node scripts/verify-ui-enhancements.mjs
      - name: Verify Vietnamese and English pages
        run: node scripts/verify-i18n.mjs
      - name: Verify Career Journey routes and chronology
        run: node scripts/verify-journey.mjs
